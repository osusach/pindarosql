name = "pindarosql"
compatibility_date = "2023-01-01"
main = "src/index.ts"

# Non-secret configuration belongs here.
[vars]
ENV = "development"

# Secrets (LIBSQL_URL, LIBSQL_TOKEN, JWT_KEY, ENC_KEY, IV, SECRET_KEY) must NOT
# be committed. For local dev put them in `.dev.vars` (gitignored), and for
# production register them with `wrangler secret put <NAME>`.

# production environment
[env.production]
name = "pindarosqlprod"
[env.production.vars]
ENV = "production"